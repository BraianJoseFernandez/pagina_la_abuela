# Gateway gratuito de WhatsApp (Evolution API v2) para La Abuela.
# Uso: cp .env.example .env && (editar la clave) && docker compose up -d
services:
  evolution-api:
    container_name: laabuela_evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    # Solo escucha en la máquina local: Laravel se conecta por 127.0.0.1:8090 (EVOLUTION_PORT)
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8090}:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: laabuela_evolution_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: laabuela_evolution_redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
