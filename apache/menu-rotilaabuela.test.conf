<VirtualHost *:80>
    ServerName menu-rotilaabuela.test
    ServerAlias pagina_la_abuela.test
    Redirect permanent / https://menu-rotilaabuela.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName menu-rotilaabuela.test
    ServerAlias pagina_la_abuela.test
    DocumentRoot "/var/www/html/pagina_la_abuela/public"
    
    SSLEngine on
    SSLCertificateFile /etc/httpd/conf/ssl/menu-rotilaabuela.test.pem
    SSLCertificateKeyFile /etc/httpd/conf/ssl/menu-rotilaabuela.test-key.pem
    
    <Directory "/var/www/html/pagina_la_abuela/public">
        DirectoryIndex index.html index.php
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ProxyPassMatch ^/(.*\.php(/.*)?)$ unix:/run/php-fpm/php-fpm.sock|fcgi://localhost/var/www/html/pagina_la_abuela/public/
</VirtualHost>
